name: CD — Build & Test || Deploy to Render

on:
  push:
    branches: [ master ]

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    # ── Service containers (MongoDB for tests) ──────────────────────────────
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # ── Steps ───────────────────────────────────────────────────────────────
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and run tests
        env:
          SERVER_PORT: 8081
          MONGODB_URI: mongodb://localhost:27017/rest_tutorial
          JWT_SECRET: ci-test-secret-value-minimum-64-chars-required-for-hs512-algorithm
          JWT_EXPIRATION_MS: 3600000
        run: ./gradlew clean test jacocoTestReport --no-daemon

  # Deploy only if the `build` job succeeds
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-22.04
    permissions:
      deployments: write
    needs: build
    if: needs.build.result == 'success'
    steps:
      - uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          github_deployment: true
          deployment_environment: 'on Render'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          wait_deploy: true
        